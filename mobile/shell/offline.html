<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frugal is offline</title>
    <!--
      The only page that ships inside the APK.

      With `server.url`, the app is a WebView pointed at the deployed site, so
      it has no offline mode by construction -- everything else is served. This
      is what the user sees instead of a blank white screen when the phone has
      no connection or the site is down, which is the whole reason `errorPath`
      exists.

      Inline styles and no assets on purpose: this file has to render when
      nothing can be fetched.
    -->
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #fbfbfa;
        color: #1a1a18;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #17171a; color: #f2f2f0; }
        .muted { color: #a3a3a0; }
      }
      main { max-width: 22rem; text-align: center; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      .muted { color: #6b6b68; font-size: 0.9375rem; }
      button {
        margin-top: 1.5rem;
        padding: 0.75rem 1.25rem;
        font: inherit;
        font-weight: 500;
        border: 0;
        border-radius: 0.5rem;
        background: #1a1a18;
        color: #fbfbfa;
      }
      @media (prefers-color-scheme: dark) {
        button { background: #f2f2f0; color: #17171a; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection</h1>
      <p class="muted">
        Frugal needs to be online to show your accounts. Nothing has been lost —
        anything captured on this phone is still waiting and will be sent once
        you reconnect.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
