[alembic]
script_location = alembic_signals
prepend_sys_path = .
path_separator = os
; The second Alembic tree (ADR-011). A separate ini file rather than a
; [alembic:signals] section in alembic.ini, and the reason is not style:
; every invocation in this repo is a bare `alembic upgrade head` -- Makefile,
; CI, conftest.py, deploy.sh. A `--name signals` layout would mean the second
; tree is reachable only by remembering a flag, and forgetting it would run
; the *primary* migration silently and successfully. `alembic -c
; alembic_signals.ini` fails loudly when it is wrong.
;
; The URL comes from Settings.signals_alembic_url at runtime
; (alembic_signals/env.py), on the direct endpoint for the same reason as
; the primary tree: DDL through a pooler is unreliable.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
