name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # Integration tests run against real Postgres and Redis, never SQLite:
    # SQLite silently accepts partial indexes, CITEXT, and NUMERIC semantics
    # that Postgres enforces, so behaviour must be verified against the real
    # engine. These are the same services docker-compose provides locally.
    services:
      postgres:
        # Keep in step with docker-compose.yml and Neon (18). A CI major that
        # trails production turns the gate green on an engine nobody runs.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: frugal
          POSTGRES_PASSWORD: frugal
          POSTGRES_DB: frugal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U frugal"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      ENVIRONMENT: ci
      DATABASE_URL: postgresql+asyncpg://frugal:frugal@localhost:5432/frugal_test
      TEST_DATABASE_URL: postgresql+asyncpg://frugal:frugal@localhost:5432/frugal_test
      # The second database (ADR-011). Settings refuses to boot if this resolves
      # to the same endpoint as DATABASE_URL, so CI proves the separation the
      # same way production does.
      SIGNALS_DATABASE_URL: postgresql+asyncpg://frugal:frugal@localhost:5432/frugal_signals_test
      TEST_SIGNALS_DATABASE_URL: postgresql+asyncpg://frugal:frugal@localhost:5432/frugal_signals_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-not-used-outside-ci-0123456789ab
      LOG_FORMAT: console
      LOG_LEVEL: WARNING

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        # `classify` is here for scikit-learn, which tests/integration/
        # test_categorization.py genuinely exercises -- without it those tests
        # fail on ModuleNotFoundError rather than being skipped, and the
        # classifier would otherwise be the one engine CI never runs. It also
        # brings numpy, which is why the OCR modules' imports resolve here.
        # `ocr` stays out: OCR_ENGINE defaults to `fake`, so nothing in the
        # suite imports cv2, and OpenCV is a large install to carry for nothing.
        #
        # `azure` is in for the opposite reason to `ocr`: it is small, pure
        # Python, and tests/unit/test_storage_adapters.py skips itself entirely
        # without it -- so leaving it out would mean the Azure adapter's SAS
        # generation is checked in no environment at all (ADR-010).
        run: pip install -e ".[auth,azure,classify,dev]"

      # `services.postgres` creates exactly one database. The second one is a
      # separate database on the same server -- weaker than production's two
      # Neon projects, and still enough: Postgres cannot express a foreign key
      # across databases and no query can join them.
      - name: Create the personalization database
        run: |
          PGPASSWORD=frugal psql -h localhost -U frugal -d frugal_test \
            -c 'CREATE DATABASE frugal_signals_test OWNER frugal'

      - name: Lint
        run: ruff check app tests scripts alembic_signals

      - name: Format check
        run: ruff format --check app tests scripts alembic_signals

      - name: Types
        run: mypy app

      # The contract that keeps module extraction cheap (ADR-001). A boundary
      # rule maintained by review decays; one maintained by a failing build
      # does not.
      - name: Module boundaries
        run: lint-imports --config .importlinter

      - name: Migrations apply cleanly
        run: |
          alembic upgrade head
          alembic -c alembic_signals.ini upgrade head

      - name: Migrations reverse cleanly
        run: |
          alembic downgrade base && alembic upgrade head
          alembic -c alembic_signals.ini downgrade base
          alembic -c alembic_signals.ini upgrade head

      # The models and the schema agree.
      #
      # They did not, for two milestones, and nothing said so. `TenantMixin`
      # declared a bare `user_id` while migration 0016 added the ON DELETE
      # CASCADE in raw SQL, and migration 0015 indexed nineteen foreign-key
      # child columns the models never mentioned. `alembic revision
      # --autogenerate` would therefore have emitted a migration DROPPING all
      # of them -- reintroducing the M10 bug where account deletion deleted
      # nothing, on the one code path that carries a legal obligation.
      #
      # Two of the four M12/M13 tables were invisible to autogenerate for the
      # same class of reason: `alembic/env.py` was missing their imports.
      #
      # `alembic check` exits non-zero when autogenerate would emit anything,
      # which makes both failures a red build instead of a discovery.
      - name: Models and schema agree
        run: |
          alembic check
          alembic -c alembic_signals.ini check

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      # The contract of record, handed to the frontend job. Dumped from
      # `app.openapi()` rather than scraped from a running server, so the check
      # needs neither a port nor the compose stack.
      - name: Export the OpenAPI document
        run: python -m scripts.dump_openapi openapi.json

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.json
          retention-days: 1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate route types
        run: npx next typegen

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Tailwind v4 here is CSS-first with no config file, so an unknown
      # utility is not an error -- it emits nothing and the element renders at
      # the browser default. Four such classes survived three milestones in
      # three files. This is the only thing that can see them.
      - name: Design tokens resolve
        run: npm run check:tokens

      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build

  api-types:
    name: API types in step
    runs-on: ubuntu-latest
    # `docs/06-project-structure.md` said CI failed on a diff here. It did not,
    # and `schema.d.ts` had been a field behind since ADR-010 added the Azure
    # upload header. This job is that claim, made true.
    needs: [backend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: backend

      - name: Install
        run: npm ci

      - name: Regenerate
        run: npm run generate:types

      - name: The committed types match the API
        run: |
          if ! git diff --exit-code -- src/lib/api/schema.d.ts; then
            echo "::error::src/lib/api/schema.d.ts is behind the API." \
                 "Run 'make types' and commit the result."
            exit 1
          fi

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The smoke spec asserts the frontend actually reaches the backend, so
      # the real stack runs -- a mocked API would not prove the path.
      # Migrations run BEFORE the API starts, which is the order deploy.sh uses
      # in production and the order this job had backwards.
      #
      # The API syncs the ~130-row product catalogue on startup (app/main.py).
      # That sync is idempotent, startup-only, and deliberately non-fatal: an
      # API booted against a schema with no `products` table logs a warning and
      # then serves an empty catalogue for the life of the process. Migrations
      # arriving a second later do not undo it, and nothing retries. That is
      # why every M9 market spec failed on `POST /market/wishlist -> 404` while
      # search still returned offers -- the provider generates those, but
      # tracking one has to resolve it against a table that was never filled.
      #
      # `run --rm` starts postgres/redis/minio via depends_on without starting
      # the API, so there is no window where it can boot too early.
      # BOTH trees, exactly as `make migrate` and `infra/azure/deploy.sh` do.
      #
      # This job migrated only the ledger for two milestones. Meanwhile
      # docker-compose.yml sets SIGNALS_DATABASE_URL and init-test-db.sql
      # creates `frugal_signals`, so the personalization feature ran here
      # configured but unmigrated -- a state neither the "enabled" nor the
      # "disabled" path anticipates. The route registered, then every
      # `GET /personalization/profile` hit a table that did not exist and 500d,
      # which is what six `renders no console errors` specs had been failing on.
      #
      # `scripts.migrate_signals`, not `alembic -c alembic_signals.ini` direct:
      # the wrapper skips cleanly when SIGNALS_DATABASE_URL is unset, where
      # alembic_signals/env.py deliberately raises instead.
      - name: Apply migrations
        run: |
          docker compose run --rm api alembic upgrade head
          docker compose run --rm api python -m scripts.migrate_signals

      # `worker` is in this list because the specs assume `make up`, which
      # starts it -- and because the diagnostics step below already dumps its
      # logs, which it could never have produced while it was never started.
      # Receipt processing and the notification sweep have no other executor.
      - name: Start backend stack
        run: docker compose up -d --wait postgres redis minio api worker

      # Cheap guard against the migration step above being dropped again. The
      # readiness probe queries a real personalization table, so this is false
      # when that database is unmigrated -- not merely unreachable.
      - name: Both databases are migrated
        run: |
          curl -fsS localhost:8000/health/ready | tee /dev/stderr \
            | grep -q '"personalization":true'

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: frontend
        run: npm run e2e

      - name: Collect diagnostics on failure
        if: failure()
        run: docker compose logs --no-color api worker

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only -- publishing happens on the deploy workflow (M11). Proving
      # the images build keeps a broken Dockerfile from being discovered at
      # deploy time.
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./infra/docker/backend.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./infra/docker/worker.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # The filesystem scan above covers the frontend only. It finds
      # package-lock.json and reads it; the backend has no lock file for it to
      # parse, so Python dependencies were never scanned at all and the job
      # reported clean. Scanning the built image reads the installed packages
      # directly, which is what surfaced six HIGH findings (setuptools, wheel,
      # jaraco.context, msgpack) that had been invisible.
      - name: Build the API image for scanning
        run: |
          docker build \
            --file infra/docker/backend.Dockerfile \
            --build-arg INSTALL_EXTRAS=auth,ocr,classify,azure \
            --tag frugal-api:scan \
            backend

      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: frugal-api:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Excludes build output, which is gitignored and so absent from the
          # git-history scan CI runs, but present for a local `gitleaks dir .`
          # -- where it produced 13 false positives out of 14 findings.
          GITLEAKS_CONFIG: .gitleaks.toml
